<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nova Ordem de Serviço</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Nova Ordem de Serviço</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">
                        Cliente
                    </label>

                    <select
                        name="cliente_id"
                        class="form-select"
                        required>

                        {% for cliente in clientes %}
                        <option value="{{ cliente.id }}">
                            {{ cliente.nome }}
                        </option>
                        {% endfor %}

                    </select>
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Equipamento
                    </label>

                    <select
                        name="equipamento_id"
                        class="form-select"
                        required>

                        {% for equipamento in equipamentos %}
                        <option value="{{ equipamento.id }}">
                            {{ equipamento.nome }}
                        </option>
                        {% endfor %}

                    </select>
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Defeito Relatado
                    </label>

                    <textarea
                        name="defeito"
                        class="form-control"
                        rows="4"
                        required></textarea>
                </div>


                <div class="mb-3">
                    <label class="form-label">
                        Diagnóstico Técnico
                    </label>

                    <textarea
                        name="diagnostico"
                        class="form-control"
                        rows="4"></textarea>
                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    Salvar OS

                </button>

                <a
                    href="/os"
                    class="btn btn-secondary">

                    Cancelar

                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
