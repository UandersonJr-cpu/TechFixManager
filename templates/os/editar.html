{% extends "base.html" %}

{% block titulo %}
Editar OS
{% endblock %}

{% block conteudo %}

<div class="card shadow">

    <div class="card-header bg-warning">
        <h3>Editar Ordem de Serviço #{{ os.id }}</h3>
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">
                <label>Status</label>

                <select name="status" class="form-select">

                    <option {% if os.status == 'Recebido' %}selected{% endif %}>
                        Recebido
                    </option>

                    <option {% if os.status == 'Em análise' %}selected{% endif %}>
                        Em análise
                    </option>

                    <option {% if os.status == 'Aguardando peça' %}selected{% endif %}>
                        Aguardando peça
                    </option>

                    <option {% if os.status == 'Em reparo' %}selected{% endif %}>
                        Em reparo
                    </option>

                    <option {% if os.status == 'Pronto' %}selected{% endif %}>
                        Pronto
                    </option>

                    <option {% if os.status == 'Entregue' %}selected{% endif %}>
                        Entregue
                    </option>

                </select>
            </div>

            <div class="mb-3">
                <label>Diagnóstico</label>

                <textarea
                    name="diagnostico"
                    class="form-control"
                    rows="4">{{ os.diagnostico }}</textarea>
            </div>

            <div class="mb-3">
                <label>Valor</label>

                <input
                    type="number"
                    step="0.01"
                    name="valor"
                    class="form-control"
                    value="{{ os.valor }}">
            </div>

            <div class="mb-3">
                <label>Observações</label>

                <textarea
                    name="observacoes"
                    class="form-control"
                    rows="4">{{ os.observacoes }}</textarea>
            </div>

            <button class="btn btn-success">
                Salvar Alterações
            </button>

            <a href="/os" class="btn btn-secondary">
                Voltar
            </a>

        </form>

    </div>

</div>

{% endblock %}
