<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <title>Login - TechFix</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            background:#f4f6f9;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:'Segoe UI',sans-serif;
            transition:.3s;
        }

        .login-card{
            width:450px;
            border:none;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,.15);
        }

        .logo{
            font-size:50px;
            text-align:center;
            color:#0d6efd;
        }

        .titulo{
            text-align:center;
            font-weight:bold;
            margin-top:10px;
        }

        .subtitulo{
            text-align:center;
            color:gray;
            margin-bottom:30px;
        }

        .theme-btn{
            position:fixed;
            top:20px;
            right:20px;
            width:55px;
            height:55px;
            border-radius:50%;
            z-index:9999;
            font-size:22px;
        }

        /* Tema Escuro */

        .dark-mode{
            background:#1e293b !important;
            color:white !important;
        }

        .dark-mode .login-card{
            background:#334155 !important;
            color:white !important;
        }

        .dark-mode .subtitulo{
            color:#cbd5e1 !important;
        }

        .dark-mode input{
            background:#475569 !important;
            color:white !important;
            border:1px solid #64748b;
        }

        .dark-mode input::placeholder{
            color:#cbd5e1;
        }

        .dark-mode .form-label{
            color:white;
        }

        .dark-mode hr{
            border-color:#64748b;
        }

        .dark-mode a{
            color:#60a5fa;
        }

    </style>

</head>

<body>

<button
    id="theme-btn"
    onclick="toggleTheme()"
    class="btn btn-dark theme-btn">
    🌙
</button>

<div class="card login-card">

    <div class="card-body p-5">

        <div class="logo">
            <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>

        <h2 class="titulo">
            TechFix
        </h2>

        <p class="subtitulo">
            Sistema de Assistência Técnica
        </p>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Digite seu email">

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Senha
                </label>

                <input
                    type="password"
                    name="senha"
                    class="form-control"
                    placeholder="Digite sua senha">

            </div>

            <button
                class="btn btn-primary w-100">

                Entrar

            </button>

        </form>

        <hr>

        <div class="text-center">

            <a href="/cadastro">
                Criar conta
            </a>

        </div>

    </div>

</div>

<script>

function toggleTheme(){

    document.body.classList.toggle("dark-mode");

    const escuro =
        document.body.classList.contains("dark-mode");

    localStorage.setItem("theme", escuro);

    document.getElementById("theme-btn").innerHTML =
        escuro ? "☀️" : "🌙";
}

if(localStorage.getItem("theme") === "true"){

    document.body.classList.add("dark-mode");

    window.addEventListener("load", function(){

        document.getElementById("theme-btn").innerHTML = "☀️";

    });

}

</script>

</body>
</html>
