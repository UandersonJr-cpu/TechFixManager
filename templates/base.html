<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <title>
        {% block titulo %}{% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            margin:0;
            background:#e5e7eb;
            font-family:'Segoe UI', sans-serif;
            transition:.3s;
        }

        .sidebar{
            width:260px;
            height:100vh;
            position:fixed;
            background:#1f2937;
            color:white;
            overflow:auto;
        }

        .logo{
            text-align:center;
            padding:25px 10px;
            border-bottom:1px solid rgba(255,255,255,.1);
        }

        .logo h3{
            margin:0;
            font-weight:bold;
        }

        .logo p{
            margin:0;
            color:#bdbdbd;
            font-size:13px;
        }

        .menu{
            padding-top:15px;
        }

        .menu a{
            display:block;
            color:white;
            text-decoration:none;
            padding:14px 20px;
            transition:.2s;
        }

        .menu a:hover{
            background:#374151;
            padding-left:28px;
        }

        .menu i{
            width:25px;
        }

        .content{
            margin-left:260px;
            padding:30px;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

        .table{
            margin-bottom:0;
        }

        .user-box{
            text-align:center;
            padding:20px;
            border-top:1px solid rgba(255,255,255,.1);
            margin-top:20px;
        }

        .user-box h6{
            margin:10px 0 0;
        }

        .user-box small{
            color:#ccc;
        }

        /* TEMA ESCURO */

        .dark-mode{
    background:#1e293b !important;
    color:#f8fafc !important;
}

.dark-mode .content{
    background:#1e293b;
}

.dark-mode .card{
    background:#334155 !important;
    color:white !important;
}

.dark-mode .table{
    color:white !important;
}

.dark-mode table{
    background:#334155 !important;
}

.dark-mode td{
    background:#334155 !important;
    color:white !important;
}

.dark-mode th{
    background:#0f172a !important;
    color:white !important;
}

.dark-mode .form-control,
.dark-mode .form-select,
.dark-mode textarea{
    background:#475569 !important;
    color:white !important;
    border:1px solid #64748b;
}

.dark-mode .form-control::placeholder{
    color:#cbd5e1;
}

.dark-mode .sidebar{
    background:#0f172a;
}

.dark-mode .user-box{
    border-top:1px solid #334155;
}

.dark-mode .btn-outline-light{
    border-color:#64748b;
}

.dark-mode .topbar{
    background:#334155;
    color:white;
}

.dark-mode small{
    color:#cbd5e1 !important;
}

        .dark-mode h1,
        .dark-mode h2,
        .dark-mode h3,
        .dark-mode h4,
        .dark-mode h5,
        .dark-mode h6,
        .dark-mode label,
        .dark-mode th,
        .dark-mode td{
            color:white;
        }

    </style>

</head>

<body id="body">

<div class="sidebar">

    <div class="logo">

        <h3>🛠 TechFix</h3>

        <p>Sistema de Assistência Técnica</p>

    </div>

    <div class="menu">

        {% if current_user.tipo == "admin" %}

        <a href="/dashboard">
            <i class="fa-solid fa-chart-line"></i>
            Dashboard
        </a>

        <a href="/clientes">
            <i class="fa-solid fa-users"></i>
            Clientes
        </a>

        <a href="/equipamentos">
            <i class="fa-solid fa-laptop"></i>
            Equipamentos
        </a>

        <a href="/os">
            <i class="fa-solid fa-file-invoice"></i>
            Ordens de Serviço
        </a>

        <a href="/tecnico">
            <i class="fa-solid fa-microchip"></i>
            Área Técnica
        </a>

        {% else %}

        <a href="/minha-area">
            <i class="fa-solid fa-box"></i>
            Meus Equipamentos
        </a>

        {% endif %}

        <button
            onclick="toggleTheme()"
            class="btn btn-outline-light mx-3 mt-3 w-75">

            🌙 Tema

        </button>

        <a href="/logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            Sair
        </a>

    </div>

    <div class="user-box">

        <i class="fa-solid fa-circle-user fa-3x"></i>

        <h6>
            {{ current_user.nome }}
        </h6>

        <small>
            {{ current_user.tipo }}
        </small>

    </div>

</div>

<div class="content">

    {% block conteudo %}
    {% endblock %}

</div>

<script>

function toggleTheme(){

    document
        .getElementById("body")
        .classList
        .toggle("dark-mode");

    localStorage.setItem(
        "tema",
        document
            .getElementById("body")
            .classList
            .contains("dark-mode")
    );

}

window.onload = function(){

    if(localStorage.getItem("tema") === "true"){

        document
            .getElementById("body")
            .classList
            .add("dark-mode");

    }

}

</script>

</body>
</html>
