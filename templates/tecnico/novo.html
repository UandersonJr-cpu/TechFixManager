{% extends "base.html" %}

{% block titulo %}
Novo Arquivo Técnico
{% endblock %}

{% block conteudo %}

<h2>🛠 Novo Arquivo Técnico</h2>

<form method="POST" enctype="multipart/form-data">

    <input
        type="text"
        name="titulo"
        placeholder="Título"
        class="form-control mb-2">

    <select
        name="categoria"
        class="form-control mb-2">

        <option>Driver</option>
        <option>BIOS</option>
        <option>Schematic</option>
        <option>Boardview</option>
        <option>Datasheet</option>
        <option>Software</option>

    </select>

    <input
        type="text"
        name="fabricante"
        placeholder="Fabricante"
        class="form-control mb-2">

    <input
        type="text"
        name="modelo"
        placeholder="Modelo"
        class="form-control mb-2">

    <textarea
        name="descricao"
        placeholder="Descrição"
        class="form-control mb-2"></textarea>

    <input
        type="file"
        name="arquivo"
        class="form-control mb-3">

    <button class="btn btn-success">
        Salvar
    </button>

</form>

{% endblock %}
