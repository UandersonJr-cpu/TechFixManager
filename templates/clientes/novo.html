{% extends "base.html" %}

{% block titulo %}
{% endblock %}

{% block conteudo %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h4 class="mb-0">
                    👤 Cadastro de Cliente
                </h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Nome
                        </label>

                        <input
                            type="text"
                            name="nome"
                            class="form-control"
                            placeholder="Digite o nome do cliente">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="cliente@email.com">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Telefone
                        </label>

                        <input
                            type="text"
                            name="telefone"
                            class="form-control"
                            placeholder="(27) 99999-9999">

                    </div>

                    <div class="d-flex gap-2">

                        <button
                            class="btn btn-success">

                            💾 Salvar

                        </button>

                        <a
                            href="/clientes"
                            class="btn btn-secondary">

                            ↩ Voltar

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
