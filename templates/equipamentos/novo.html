{% extends "base.html" %}

{% block titulo %}
{% endblock %}

{% block conteudo %}

<div class="row justify-content-center">

    <div class="col-lg-9">

        <div class="card shadow border-0">

            <div class="card-header bg-success text-white">

                <h4 class="mb-0">
                    💻 Cadastro de Equipamento
                </h4>

            </div>

            <div class="card-body">

                <form method="POST"
                      enctype="multipart/form-data">

                    <div class="mb-3">

                        <label class="form-label">
                            Cliente
                        </label>

                        <select
                            name="cliente_id"
                            class="form-select">

                            {% for c in clientes %}

                            <option value="{{ c.id }}">
                                {{ c.nome }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Produto
                            </label>

                            <input
                                type="text"
                                name="nome"
                                class="form-control"
                                placeholder="Notebook, Celular, Impressora">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Marca
                            </label>

                            <input
                                type="text"
                                name="marca"
                                class="form-control"
                                placeholder="Dell, Acer, Lenovo...">

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Modelo
                            </label>

                            <input
                                type="text"
                                name="modelo"
                                class="form-control"
                                placeholder="Inspiron 15">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Número de Série
                            </label>

                            <input
                                type="text"
                                name="serial"
                                class="form-control"
                                placeholder="Serial do equipamento">

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Foto do Equipamento
                        </label>

                        <input
                            type="file"
                            name="foto"
                            class="form-control">

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success">

                        💾 Salvar

                    </button>

                    <a
                        href="/equipamentos"
                        class="btn btn-secondary">

                        ↩ Voltar

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
